name: healthcare_workforce
description: "Healthcare Workforce Platform Flutter Android Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Services
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.1
  cloud_functions: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.1
  firebase_app_check: ^0.3.0+1
  firebase_remote_config: ^5.0.0
  firebase_crashlytics: ^4.0.1
  firebase_performance: ^0.10.0+1
  firebase_analytics: ^11.0.0

  # Architecture & State Management
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI, Icons, Typography & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  file_picker: ^8.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
