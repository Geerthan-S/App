name: Mobile security (MobSF)

# Weekly static analysis of the Android app (blueprint §9.7): mobsfscan over
# the source, then a full MobSF scan of a freshly built APK. Reports are kept
# as artifacts; review them before each Play Store release.

on:
  schedule:
    - cron: '0 22 * * 0' # Mondays 03:30 IST
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  mobsfscan:
    name: Source scan (mobsfscan)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install mobsfscan==0.4.3
      - run: mobsfscan android lib --sarif --output mobsfscan.sarif || true
      - uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        if: always() && hashFiles('mobsfscan.sarif') != ''
        with:
          sarif_file: mobsfscan.sarif
          category: mobsfscan

  apk-scan:
    name: APK scan (MobSF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Release builds require the client-owned upload key (android/key.properties),
      # which never enters CI, so this scans a debug APK. Expect MobSF to flag
      # "debuggable" and cleartext-to-emulator findings that do not apply to the
      # Play build; run MobSF locally on the signed release APK before each release.
      - run: flutter build apk --debug
      - name: Start MobSF
        env:
          MOBSF_API_KEY: ci-only-${{ github.run_id }}
        run: |
          docker run -d --name mobsf -p 8000:8000 -e MOBSF_API_KEY="$MOBSF_API_KEY" \
            opensecurity/mobile-security-framework-mobsf:v4.2.9
          for i in $(seq 1 90); do curl -sf http://localhost:8000/api_docs > /dev/null && exit 0; sleep 2; done
          docker logs mobsf; exit 1
      - name: Scan APK
        env:
          MOBSF_API_KEY: ci-only-${{ github.run_id }}
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          HASH=$(curl -sf -F "file=@${APK}" -H "Authorization: $MOBSF_API_KEY" http://localhost:8000/api/v1/upload | jq -r .hash)
          curl -sf -X POST -d "hash=${HASH}" -H "Authorization: $MOBSF_API_KEY" http://localhost:8000/api/v1/scan > /dev/null
          curl -sf -X POST -d "hash=${HASH}" -H "Authorization: $MOBSF_API_KEY" http://localhost:8000/api/v1/report_json > mobsf-report.json
          curl -sf -X POST -d "hash=${HASH}" -H "Authorization: $MOBSF_API_KEY" http://localhost:8000/api/v1/download_pdf -o mobsf-report.pdf || true
          jq '{security_score: .appsec.security_score, high: (.appsec.high | length), warning: (.appsec.warning | length)}' mobsf-report.json | tee mobsf-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mobsf-report
          path: |
            mobsf-report.json
            mobsf-report.pdf
            mobsf-summary.json
          if-no-files-found: ignore
