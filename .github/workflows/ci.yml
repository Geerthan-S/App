name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  functions:
    name: Functions build + emulator tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npm install -g firebase-tools
      # Runs every Jest suite, including the production-handler and rules
      # suites that only execute when the Firestore/Storage emulators are up.
      - run: npm run test:emulator

  flutter:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Errors fail the build. Existing warnings/infos are a tracked baseline
      # (docs/deployment-review-2026-10-08.md) to burn down before making them fatal.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
